name: Build

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/backend/package-lock.json
            app/frontend/package-lock.json
      - name: Validate version and release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(awk 'END { print NR }' VERSION)" != "1" ]]; then
            echo "VERSION must contain exactly one line" >&2
            exit 1
          fi
          IMAGE_VERSION="$(cat VERSION)"
          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-zh-cn\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $IMAGE_VERSION" >&2
            exit 1
          fi
          CORE_VERSION="${IMAGE_VERSION%%-zh-cn.*}"
          grep -Fqx "ENV VERSION=$CORE_VERSION" Dockerfile
          grep -Fqx "ARG CLOUDFLARED_VERSION=$CORE_VERSION" Dockerfile
          grep -Fq "refs/tags/$CORE_VERSION" Dockerfile
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$IMAGE_VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $IMAGE_VERSION" >&2
            exit 1
          fi
      - name: Check backend
        working-directory: app/backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          node --check app.js
          node --check cloudflare-tunnel.js
          node --check update-auth.js
          node --check updater-client.js
          node --check updater.js
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

  scan:
    name: Build and scan image (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
          - name: arm64
            platform: linux/arm64
          - name: arm-v7
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build candidate by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Report all findings for the exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Block fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Save scanned digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          DIGEST_HEX="${IMAGE_DIGEST#sha256:}"
          [[ "$DIGEST_HEX" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p /tmp/digests
          printf '%s\n' "$IMAGE_DIGEST" > "/tmp/digests/$PLATFORM_NAME"
      - name: Upload scanned digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Read image version
        run: |
          IMAGE_VERSION=$(cat VERSION)
          echo "version is $IMAGE_VERSION"
          echo "DOCKER_TAG=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download scanned digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Publish scanned digests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t DIGEST_FILES < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#DIGEST_FILES[@]}" != "3" ]]; then
            echo "Expected 3 scanned image digests, found ${#DIGEST_FILES[@]}" >&2
            exit 1
          fi
          SOURCES=()
          for DIGEST_FILE in "${DIGEST_FILES[@]}"; do
            IMAGE_DIGEST="$(cat "/tmp/digests/$DIGEST_FILE")"
            [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            SOURCES+=("$IMAGE_NAME@$IMAGE_DIGEST")
          done
          docker buildx imagetools create \
            "${SOURCES[@]}" \
            --tag "$IMAGE_NAME:$DOCKER_TAG" \
            --tag "$IMAGE_NAME:latest"
          docker buildx imagetools inspect "$IMAGE_NAME:$DOCKER_TAG"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - scan
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "$RELEASE_TAG"
